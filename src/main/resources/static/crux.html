<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crux</title>
    <link rel="stylesheet" href="/crux-page.css">
</head>
<body>
<header class="top">
    <a class="brand" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 L9 8 L13 13 L16 9 L21 18 Z"/></svg>
        Grań
    </a>
    <nav data-auth-nav>
        <a href="/trails">Szlaki</a>
        <a href="/login">Zaloguj</a>
        <a href="/register">Rejestracja</a>
    </nav>
</header>
<main>
    <p class="crumb"><a id="back" href="/trails">Szlak</a> / <span id="crumb-name">…</span></p>
    <article id="card">
        <p class="empty">Wczytywanie cruxa…</p>
    </article>
</main>
<script src="/auth.js"></script>
<script>
    const card = document.querySelector("#card");
    const crumbName = document.querySelector("#crumb-name");
    const back = document.querySelector("#back");
    const cruxId = location.pathname.split("/").filter(Boolean).pop();

    Promise.all([
        fetch("/api/cruxes/" + cruxId).then(function (response) {
            if (!response.ok) {
                throw new Error("missing");
            }
            return response.json();
        }),
        window.GranAuth.ready
    ])
        .then(function (results) {
            const crux = results[0];
            return fetch("/api/trails/" + crux.trail.id)
                .then(function (response) {
                    return response.ok ? response.json() : { cruxes: [] };
                })
                .then(function (trail) {
                    showCrux(crux, trail.cruxes || []);
                });
        })
        .catch(showMissing);

    function showCrux(crux, cruxes) {
        document.title = crux.name;
        crumbName.textContent = crux.name;
        back.href = "/trails/" + crux.trail.id;
        back.textContent = crux.trail.name;
        const neighbors = findNeighbors(cruxes, crux.id);
        const adminActions = window.GranAuth.isAdmin()
            ? `<p class="actions">
                <a class="edit-trail" href="/trails/${crux.trail.id}">Edytuj na stronie szlaku</a>
                <button id="delete-crux" class="delete-trail" type="button">Usuń crux</button>
               </p>`
            : "";
        card.innerHTML = `
            <div class="photo" aria-hidden="true">
                <svg viewBox="0 0 640 280" preserveAspectRatio="xMidYMax slice">
                    <rect width="640" height="280" fill="#d5e0da"/>
                    <path d="M0 190 L120 90 L200 140 L300 50 L410 130 L500 80 L640 150 L640 280 L0 280 Z" fill="#315246"/>
                    <path d="M0 230 L160 170 L280 210 L420 160 L540 200 L640 170 L640 280 L0 280 Z" fill="#1d332b"/>
                </svg>
                <p>Zdjęcie odcinka</p>
            </div>
            <p class="eyebrow">Odcinek ${crux.position}</p>
            <h1>${escapeHtml(crux.name)}</h1>
            <p class="where">Na szlaku ${escapeHtml(crux.trail.name)}</p>
            ${adminActions}
            <p class="description">${escapeHtml(crux.description)}</p>
            ${videoHtml(crux.youtubeId)}
            <div class="neighbors">
                ${neighborLink(neighbors.previous, "Poprzedni crux", true)}
                ${neighborLink(neighbors.next, "Następny crux", false)}
            </div>
        `;
        const deleteButton = document.querySelector("#delete-crux");
        if (deleteButton) {
            deleteButton.addEventListener("click", function () {
                if (!window.confirm("Usunąć ten crux?")) {
                    return;
                }
                fetch("/api/cruxes/" + cruxId, {
                    method: "DELETE",
                    credentials: "same-origin"
                })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error("failed");
                        }
                        location.href = "/trails/" + crux.trail.id;
                    })
                    .catch(function () {
                        window.alert("Nie udało się usunąć cruxa.");
                    });
            });
        }
    }

    function findNeighbors(cruxes, id) {
        const sorted = cruxes.slice().sort(function (a, b) {
            return a.position - b.position;
        });
        const index = sorted.findIndex(function (crux) {
            return String(crux.id) === String(id);
        });
        return {
            previous: index > 0 ? sorted[index - 1] : null,
            next: index >= 0 && index < sorted.length - 1 ? sorted[index + 1] : null
        };
    }

    function neighborLink(crux, label, previous) {
        const arrow = previous ? "← " : "";
        const arrowAfter = previous ? "" : " →";
        if (!crux) {
            return `<span class="neighbor disabled">${arrow}${label}${arrowAfter}</span>`;
        }
        return `<a class="neighbor" href="/cruxes/${crux.id}">${arrow}${label}${arrowAfter}</a>`;
    }

    function showMissing() {
        document.title = "Nie ma takiego cruxa";
        crumbName.textContent = "Brak cruxa";
        card.innerHTML = '<p class="empty">Nie ma cruxa o tym numerze.</p>';
    }

    function videoHtml(youtubeId) {
        if (!/^[A-Za-z0-9_-]{6,20}$/.test(youtubeId || "")) {
            return "";
        }
        return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${youtubeId}" title="Przejście odcinka" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`;
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }
</script>
</body>
</html>
