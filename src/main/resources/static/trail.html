<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Szlak</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="page">
    <p class="mark">Tatry Polskie</p>
    <p class="back"><a href="/trails">Wróć do listy</a></p>
    <article id="card" class="card">
        <p class="empty">Wczytywanie szlaku…</p>
    </article>
    <section id="cruxes" class="cruxes" hidden>
        <h2>Cruxy</h2>
        <ul id="crux-list"></ul>
    </section>
</main>
<script>
    const card = document.querySelector("#card");
    const id = location.pathname.split("/").filter(Boolean).pop();

    fetch("/api/trails/" + id)
        .then(function (response) {
            if (!response.ok) {
                throw new Error("missing");
            }
            return response.json();
        })
        .then(function (trail) {
            showTrail(trail);
            showCruxes(trail.cruxes);
        })
        .catch(showMissing);

    function showTrail(trail) {
        document.title = trail.name;
        card.innerHTML = `
            <h2>${escapeHtml(trail.name)}</h2>
            <div class="photo" aria-hidden="true">
                <svg viewBox="0 0 640 220" preserveAspectRatio="xMidYMax slice">
                    <rect width="640" height="220" fill="#d7e0db"/>
                    <path d="M0 150 L90 92 L150 124 L230 58 L310 118 L390 74 L470 132 L560 86 L640 128 L640 220 L0 220 Z" fill="#31423b"/>
                    <path d="M0 176 L120 142 L210 168 L330 124 L430 166 L530 140 L640 172 L640 220 L0 220 Z" fill="#1d2823"/>
                </svg>
            </div>
            <hr>
            <dl class="stats">
                <div><dt>Start</dt><dd>${escapeHtml(trail.startPoint)}</dd></div>
                <div><dt>Dystans</dt><dd>${formatNumber(trail.distance)} km</dd></div>
                <div><dt>Trudność techniczna</dt><dd>${formatNumber(trail.technicalDifficulty)}</dd></div>
                <div><dt>Ekspozycja</dt><dd>${formatNumber(trail.exposure)}</dd></div>
                <div><dt>Kondycja</dt><dd>${formatNumber(trail.condition)}</dd></div>
            </dl>
            ${mapLink(trail.mapUrl)}
        `;
    }

    function mapLink(url) {
        if (!url) {
            return "";
        }
        return `<p class="map-link"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Zobacz przebieg na mapie</a></p>`;
    }

    function showCruxes(cruxes) {
        if (!cruxes) {
            return;
        }
        const section = document.querySelector("#cruxes");
        const list = document.querySelector("#crux-list");
        section.hidden = false;
        if (cruxes.length === 0) {
            list.innerHTML = "<li>Brak opisanych cruxów.</li>";
            return;
        }
        list.innerHTML = cruxes.map(function (crux) {
            return `<li><a href="/cruxes/${crux.id}">${escapeHtml(crux.name)}</a><span>${escapeHtml(crux.description)}</span></li>`;
        }).join("");
    }

    function showMissing() {
        document.title = "Nie ma takiego szlaku";
        card.innerHTML = '<p class="empty">Nie ma szlaku o tym numerze.</p>';
    }

    function formatNumber(value) {
        const number = Number(value);
        return Number.isInteger(number) ? String(number) : number.toFixed(1);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }
</script>
</body>
</html>
