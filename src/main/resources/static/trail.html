<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Szlak</title>
    <link rel="stylesheet" href="/trail-page.css">
</head>
<body>
<header class="top">
    <a class="brand" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18 L9 8 L13 13 L16 9 L21 18 Z"/></svg>
        Grań
    </a>
    <nav data-auth-nav>
        <a href="/trails">Szlaki</a>
        <a href="/login">Zaloguj</a>
        <a href="/register">Rejestracja</a>
    </nav>
</header>
<main>
    <p class="crumb"><a href="/trails">Szlaki</a> / <span id="crumb-name">…</span></p>
    <article id="card">
        <p class="empty">Wczytywanie szlaku…</p>
    </article>
</main>
<script src="/auth.js"></script>
<script>
    const card = document.querySelector("#card");
    const crumbName = document.querySelector("#crumb-name");
    const id = location.pathname.split("/").filter(Boolean).pop();

    Promise.all([
        fetch("/api/trails/" + id).then(function (response) {
            if (!response.ok) {
                throw new Error("missing");
            }
            return response.json();
        }),
        window.GranAuth.ready
    ])
        .then(function (results) {
            showTrail(results[0]);
        })
        .catch(showMissing);

    function showTrail(trail) {
        document.title = trail.name;
        crumbName.textContent = trail.name;
        const adminActions = window.GranAuth.isAdmin()
            ? `<p class="actions"><a class="edit-trail" href="/trails/${trail.id}/edit">Edytuj szlak</a><button id="delete-trail" class="delete-trail" type="button">Usuń szlak</button></p>`
            : "";
        card.innerHTML = `
            <header class="trail-head">
                <p class="trail-level">${level(trail.technicalDifficulty)}</p>
                <h1>${escapeHtml(trail.name)}</h1>
                <p class="trail-start">Start: ${escapeHtml(trail.startPoint)}</p>
                ${adminActions}
            </header>
            <dl class="facts">
                <div><dt>Ekspozycja</dt><dd>${formatNumber(trail.exposure)} / 5</dd></div>
                <div><dt>Technika</dt><dd>${formatNumber(trail.technicalDifficulty)} / 5</dd></div>
                <div><dt>Kondycja</dt><dd>${formatNumber(trail.condition)} / 5</dd></div>
                <div><dt>Dystans</dt><dd>${formatNumber(trail.distance)} km</dd></div>
            </dl>
            <div class="sheet">
                <div class="column">
                    <section>
                        <h2>Charakterystyka</h2>
                        <p>Opis szlaku dojdzie razem z danymi. Na razie widać skale, listę cruxów i link do przebiegu.</p>
                    </section>
                    <section>
                        <h2>Cruxy</h2>
                        ${cruxList(trail.cruxes)}
                        ${window.GranAuth.isAdmin() ? cruxAdminForm() : ""}
                    </section>
                </div>
                <div class="column">
                    <section class="panel">
                        <h2>Przebieg na mapie</h2>
                        <p>Trasa otwiera się na mapie turystycznej.</p>
                        ${mapLink(trail.mapUrl)}
                    </section>
                    <section class="panel">
                        <h2>Profil wysokości</h2>
                        <svg class="profile" viewBox="0 0 640 180" role="img" aria-label="Przykładowy profil wysokości">
                            <path d="M16 140 L110 124 L190 96 L270 112 L350 48 L450 78 L530 120 L624 108 L624 156 L16 156 Z" fill="#d7e3dc"/>
                            <path d="M16 140 L110 124 L190 96 L270 112 L350 48 L450 78 L530 120 L624 108" fill="none" stroke="#1b4332" stroke-width="3"/>
                            <circle cx="110" cy="124" r="5" fill="#1b4332"/>
                            <circle cx="350" cy="48" r="5" fill="#1b4332"/>
                        </svg>
                        <div class="profile-labels">
                            <span>${escapeHtml(trail.startPoint)}</span>
                            <span>Grań</span>
                        </div>
                    </section>
                </div>
            </div>
        `;
        const deleteButton = document.querySelector("#delete-trail");
        if (deleteButton) {
            deleteButton.addEventListener("click", deleteTrail);
        }
        bindCruxAdmin(trail);
    }

    function deleteTrail() {
        if (!window.confirm("Usunąć ten szlak razem z jego cruxami?")) {
            return;
        }
        fetch("/api/trails/" + id, { method: "DELETE" })
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("failed");
                }
                location.href = "/trails";
            })
            .catch(function () {
                window.alert("Nie udało się usunąć szlaku.");
            });
    }

    function cruxList(cruxes) {
        if (!cruxes || cruxes.length === 0) {
            return '<p class="muted">Brak opisanych cruxów.</p>';
        }
        const admin = window.GranAuth.isAdmin();
        return `<ol class="crux-list">${cruxes.map(function (crux) {
            const actions = admin
                ? `<p class="crux-actions">
                    <button type="button" class="crux-edit" data-crux-id="${crux.id}">Edytuj</button>
                    <button type="button" class="crux-delete" data-crux-id="${crux.id}">Usuń</button>
                   </p>`
                : "";
            return `
                <li data-crux-item="${crux.id}">
                    <a href="/cruxes/${crux.id}">${escapeHtml(crux.name)}</a>
                    <p>${escapeHtml(crux.description)}</p>
                    ${actions}
                </li>
            `;
        }).join("")}</ol>`;
    }

    function cruxAdminForm() {
        return `
            <form id="crux-form" class="crux-form">
                <h3 id="crux-form-title">Dodaj crux</h3>
                <p id="crux-form-error" class="error" hidden>Nie udało się zapisać cruxa.</p>
                <input type="hidden" name="cruxId" value="">
                <label>
                    Nazwa
                    <input name="name" required maxlength="200" placeholder="np. Kozi Wierch">
                </label>
                <label>
                    Kolejność
                    <input name="position" type="number" min="1" step="1" placeholder="puste = na końcu">
                </label>
                <label>
                    Opis
                    <textarea name="description" required maxlength="1000" rows="3" placeholder="Co jest trudne na tym odcinku"></textarea>
                </label>
                <label>
                    YouTube ID
                    <input name="youtubeId" maxlength="20" placeholder="np. dQw4w9WgXcQ">
                </label>
                <div class="crux-form-actions">
                    <button type="submit">Zapisz crux</button>
                    <button type="button" id="crux-cancel" class="ghost" hidden>Anuluj edycję</button>
                </div>
            </form>
        `;
    }

    function bindCruxAdmin(trail) {
        if (!window.GranAuth.isAdmin()) {
            return;
        }
        const form = document.querySelector("#crux-form");
        const error = document.querySelector("#crux-form-error");
        const title = document.querySelector("#crux-form-title");
        const cancel = document.querySelector("#crux-cancel");
        const cruxById = {};
        (trail.cruxes || []).forEach(function (crux) {
            cruxById[String(crux.id)] = crux;
        });

        function resetForm() {
            form.reset();
            form.cruxId.value = "";
            title.textContent = "Dodaj crux";
            cancel.hidden = true;
            error.hidden = true;
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            error.hidden = true;
            const data = new FormData(form);
            const cruxId = String(data.get("cruxId") || "").trim();
            const positionRaw = String(data.get("position") || "").trim();
            const body = {
                name: String(data.get("name") || "").trim(),
                description: String(data.get("description") || "").trim(),
                youtubeId: String(data.get("youtubeId") || "").trim() || null,
                position: positionRaw ? Number(positionRaw) : null
            };
            const creating = !cruxId;
            const url = creating
                ? "/api/trails/" + id + "/cruxes"
                : "/api/cruxes/" + cruxId;
            fetch(url, {
                method: creating ? "POST" : "PUT",
                headers: { "Content-Type": "application/json" },
                credentials: "same-origin",
                body: JSON.stringify(body)
            })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("failed");
                    }
                    location.reload();
                })
                .catch(function () {
                    error.hidden = false;
                });
        });

        cancel.addEventListener("click", resetForm);

        document.querySelectorAll(".crux-edit").forEach(function (button) {
            button.addEventListener("click", function () {
                const crux = cruxById[button.getAttribute("data-crux-id")];
                if (!crux) {
                    return;
                }
                form.cruxId.value = crux.id;
                form.name.value = crux.name;
                form.position.value = crux.position;
                form.description.value = crux.description;
                form.youtubeId.value = crux.youtubeId || "";
                title.textContent = "Edytuj crux";
                cancel.hidden = false;
                form.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });
        });

        document.querySelectorAll(".crux-delete").forEach(function (button) {
            button.addEventListener("click", function () {
                const cruxId = button.getAttribute("data-crux-id");
                const crux = cruxById[cruxId];
                if (!window.confirm("Usunąć crux „" + (crux ? crux.name : cruxId) + "”?")) {
                    return;
                }
                fetch("/api/cruxes/" + cruxId, {
                    method: "DELETE",
                    credentials: "same-origin"
                })
                    .then(function (response) {
                        if (!response.ok) {
                            throw new Error("failed");
                        }
                        location.reload();
                    })
                    .catch(function () {
                        window.alert("Nie udało się usunąć cruxa.");
                    });
            });
        });
    }

    function mapLink(url) {
        if (!url) {
            return '<p class="muted">Ten szlak nie ma jeszcze linku do mapy.</p>';
        }
        return `<a class="button" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Zobacz przebieg na mapie</a>`;
    }

    function showMissing() {
        document.title = "Nie ma takiego szlaku";
        crumbName.textContent = "Brak szlaku";
        card.innerHTML = '<p class="empty">Nie ma szlaku o tym numerze.</p>';
    }

    function level(value) {
        const number = Number(value);
        if (number >= 4) {
            return "Wymagający";
        }
        if (number >= 2.5) {
            return "Średni";
        }
        return "Łatwy";
    }

    function formatNumber(value) {
        const number = Number(value);
        return Number.isInteger(number) ? String(number) : number.toFixed(1);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
    }
</script>
</body>
</html>
